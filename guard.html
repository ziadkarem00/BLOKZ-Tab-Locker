<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLOKZ — Anti-Uninstall Security Guard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.18), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.14), transparent 45%),
        #070B14;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .guard-card {
      width: 420px;
      max-width: 94vw;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 28px;
      padding: 36px 32px 30px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85);
      text-align: center;
    }
    .guard-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, #EF4444 0%, #6366F1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(239, 68, 68, 0.35);
    }
    .guard-icon svg {
      width: 32px;
      height: 32px;
      stroke: #FFFFFF;
    }
    .guard-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #FCA5A5;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .guard-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .guard-desc {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .guard-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }
    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: #E0E7FF;
      margin-bottom: 5px;
      display: block;
    }
    .guard-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: #0B1120;
      color: #F8FAFC;
      font-size: 15px;
      outline: none;
    }
    .guard-input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .guard-error {
      min-height: 18px;
      font-size: 12.5px;
      color: #F87171;
      text-align: center;
      font-weight: 600;
    }
    .guard-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    .guard-btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="guard-card">
    <div class="guard-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </div>
    <div class="guard-tag">BLOKZ ANTI-UNINSTALL GUARD</div>
    <h1 class="guard-title">Web Extensions Locked</h1>
    <p class="guard-desc">
      To prevent unauthorized removal or disabling of <strong>BLOKZ</strong> in your browser, verify your 4-digit PIN and security question below.
    </p>

    <form id="guardForm" class="guard-form">
      <div>
        <label class="field-label" for="pinInput">4-Digit PIN</label>
        <input
          type="password"
          id="pinInput"
          class="guard-input"
          maxlength="4"
          inputmode="numeric"
          pattern="\d{4}"
          placeholder="••••"
          required
        />
      </div>

      <div>
        <label class="field-label" for="catInput">What is your cat's name?</label>
        <input
          type="text"
          id="catInput"
          class="guard-input"
          maxlength="10"
          placeholder="Max 10 characters"
          autocomplete="off"
          required
        />
      </div>

      <div id="guardError" class="guard-error"></div>

      <button type="submit" class="guard-btn">Verify & Unlock Web Extensions</button>
    </form>
  </div>
  <script src="guard.js"></script>
</body>
</html>
